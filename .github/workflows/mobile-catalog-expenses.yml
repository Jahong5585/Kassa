name: Android API compatibility

on:
  push:
    branches:
      - codex/server-mobile-catalog-expenses

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: bash tests/run.sh
