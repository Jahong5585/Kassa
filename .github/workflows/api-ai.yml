name: API AI integration

on:
  push:
    branches:
      - codex/kassa-ai
  pull_request:
    paths:
      - "src/Kasa.Api/**"
      - "tests/**"
      - "db/**"
      - "compose.yaml"
      - ".github/workflows/api-ai.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: bash tests/run.sh
