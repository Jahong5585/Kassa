name: Build Kassa Android 0.2.81

on:
  push:
    branches: ['codex/android-receiving-design-0.2.81']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Restore Android source
        shell: bash
        run: |
          cat build/kassa-android-0.2.72/source.zip.part.* > source.zip
          echo 'e5cd036e3eae92aa1b3b2c8424220b9b685c26e3324c4c28ba29551ea162f522  source.zip' | sha256sum --check
          unzip -q source.zip -d compiled-source
          patch --batch -p1 -d compiled-source < build/kassa-first-login/android.patch
          echo '5289966787cc40e1e3e74fcdc00f5ba9588258dea619404393214e84cc8d4627  build/kassa-account-login/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-account-login/android.patch
          echo 'b474f28db9e848bcb90780fece8a3b1c6930786607c49e3d6819df65439904ed  build/kassa-owner-login/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-owner-login/android.patch
          echo 'bb5c4b3f684dbb4ed1d11491ef2324ae61c663290f4268ef7ab3011f9b2ae844  build/kassa-owner-keycloak/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-owner-keycloak/android.patch
          echo '39c2ebdd6537933aa4a593edc49087dcf1677356578ef22baee32d010fbdc011  build/kassa-owner-registers/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-owner-registers/android.patch
          echo '2d869a8e7f6b6fa3aae834103266ea393bfb3f1d8d9f4b4e13a937d3e6937515  build/kassa-android-design/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-android-design/android.patch
          echo '75ecb1f51f0113dd28611bfc57bcd2cafe336b9998bc175cf1e5043a8814e829  build/kassa-shift-conflict/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-shift-conflict/android.patch

          echo 'ac718a16bfa2fef3becbe152e930758be8420ddc37b830033d30979193d16da9  build/kassa-receiving-design/android.patch' | sha256sum --check
          patch --batch --fuzz=0 -p1 -d compiled-source < build/kassa-receiving-design/android.patch

      - name: Test Android client
        working-directory: compiled-source/apps/mobile-flutter
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub --reporter expanded

      - name: Render Android screens
        id: render
        continue-on-error: true
        working-directory: compiled-source/apps/mobile-flutter
        shell: bash
        run: |
          export KASSA_PREVIEW_TEXT_FONT="$(fc-match -f '%{file}' 'Roboto')"
          flutter_bin="$(dirname "$(readlink -f "$(command -v flutter)")")"
          export KASSA_PREVIEW_ICONS="$(find "$flutter_bin/cache/artifacts/material_fonts" -iname '*materialicons*' -type f -print -quit)"
          KASSA_RECEIVING_PREVIEW=design-preview flutter test --no-pub test/receiving_design_test.dart --reporter expanded

      - uses: actions/upload-artifact@v4
        if: steps.render.outcome == 'success'
        with:
          name: Kassa-Android-0.2.81-SCREENS
          path: compiled-source/apps/mobile-flutter/design-preview/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Install Android build components
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/kassa-android-sdk"
          tools="$RUNNER_TEMP/kassa-android-tools.zip"
          curl --fail --location --silent --show-error --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$tools"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $tools" | sha256sum --check
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$tools" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Compile and sign the test APK
        working-directory: compiled-source/apps/mobile-flutter
        shell: bash
        run: |
          sed -i 's/applicationId = "uz.qrspace.kassa.mobile.multirolepilot"/applicationId = "uz.qrspace.kassa.mobile.multirolepilot.receivingpreview"/' android/app/build.gradle.kts
          store_password="$(openssl rand -hex 20)"
          echo "::add-mask::$store_password"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/kassa-test.p12" \
            -storepass "$store_password" -keypass "$store_password" \
            -alias kassa-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Kassa Android Test Build'
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=kassa-test\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/kassa-test.p12" "$store_password" "$store_password" > android/key.properties
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64 \
            --dart-define=KASSA_PRODUCTION_API=true --dart-define=KASSA_NATIVE_INVITATION=true

      - name: Verify test APK
        shell: bash
        run: |
          mkdir -p apk-delivery
          cd apk-delivery
          apk=Kassa_Android_0.2.81_TEST.apk
          cp ../compiled-source/apps/mobile-flutter/build/app/outputs/flutter-apk/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > badging.txt
          grep -F "package: name='uz.qrspace.kassa.mobile.multirolepilot.receivingpreview' versionCode='2101' versionName='0.2.81'" badging.txt
          grep -Fx "application-label:'Касса · Роли 0.2.81'" badging.txt
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libapp.so'
          unzip -Z1 "$apk" | grep -Fx 'lib/armeabi-v7a/libapp.so'
          unzip -p "$apk" lib/arm64-v8a/libapp.so > "$RUNNER_TEMP/kassa-libapp.so"
          grep -aFo 'https://kassa.qr-space.uz' "$RUNNER_TEMP/kassa-libapp.so" | sort -u
          grep -aFo '/v1/mobile/auth/' "$RUNNER_TEMP/kassa-libapp.so" | sort -u
          sha256sum "$apk" | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kassa-Android-0.2.81-TEST
          path: |
            apk-delivery/Kassa_Android_0.2.81_TEST.apk
            apk-delivery/SHA256SUMS.txt
            apk-delivery/APK-SIGNATURE.txt
            apk-delivery/badging.txt
          if-no-files-found: error
          retention-days: 7

