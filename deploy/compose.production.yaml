name: kasa-production

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kasa
      POSTGRES_USER: kasa_owner
      POSTGRES_PASSWORD: ${POS_DB_OWNER_PASSWORD:?set POS_DB_OWNER_PASSWORD}
      POS_DB_APP_PASSWORD: ${POS_DB_APP_PASSWORD:?set POS_DB_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KASA_ADMIN_SUBJECT: ${KASA_ADMIN_SUBJECT:?set KASA_ADMIN_SUBJECT}
    ports:
      - "127.0.0.1:${POS_DB_PORT:-5432}:5432"
    volumes:
      - kasa_postgres_data:/var/lib/postgresql/data
      - ../db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ../db/002_runtime_role.sh:/docker-entrypoint-initdb.d/002_runtime_role.sh:ro
      - ../db/003_returns_and_receipts.sql:/docker-entrypoint-initdb.d/003_returns_and_receipts.sql:ro
      - ../db/004_suppliers_invoice_files_receipt_costs.sql:/docker-entrypoint-initdb.d/004_suppliers_invoice_files_receipt_costs.sql:ro
      - ../db/005_inventory_and_expiry.sql:/docker-entrypoint-initdb.d/005_inventory_and_expiry.sql:ro
      - ../db/006_catalog_and_prices.sql:/docker-entrypoint-initdb.d/006_catalog_and_prices.sql:ro
      - ../db/007_checkout_and_cash.sql:/docker-entrypoint-initdb.d/007_checkout_and_cash.sql:ro
      - ../db/008_supplier_procurement.sql:/docker-entrypoint-initdb.d/008_supplier_procurement.sql:ro
      - ../db/009_replenishment.sql:/docker-entrypoint-initdb.d/009_replenishment.sql:ro
      - ../db/010_replenishment_policies.sql:/docker-entrypoint-initdb.d/010_replenishment_policies.sql:ro
      - ../db/011_replenishment_refresh.sql:/docker-entrypoint-initdb.d/011_replenishment_refresh.sql:ro
      - ../db/012_sales_period_reports.sql:/docker-entrypoint-initdb.d/012_sales_period_reports.sql:ro
      - ../db/013_stock_movement_reports.sql:/docker-entrypoint-initdb.d/013_stock_movement_reports.sql:ro
      - ../db/014_supplier_invoice_settlements.sql:/docker-entrypoint-initdb.d/014_supplier_invoice_settlements.sql:ro
      - ../db/015_supplier_credit_transfers.sql:/docker-entrypoint-initdb.d/015_supplier_credit_transfers.sql:ro
      - ../db/016_opening_stock.sql:/docker-entrypoint-initdb.d/016_opening_stock.sql:ro
      - ../db/017_scoped_inventory.sql:/docker-entrypoint-initdb.d/017_scoped_inventory.sql:ro
      - ../db/018_inventory_cost.sql:/docker-entrypoint-initdb.d/018_inventory_cost.sql:ro
      - ../db/019_register_devices.sql:/docker-entrypoint-initdb.d/019_register_devices.sql:ro
      - ../db/020_staff_store_access.sql:/docker-entrypoint-initdb.d/020_staff_store_access.sql:ro
      - ../db/021_audit_read.sql:/docker-entrypoint-initdb.d/021_audit_read.sql:ro
      - ../db/022_receipt_cancellation.sql:/docker-entrypoint-initdb.d/022_receipt_cancellation.sql:ro
      - ../db/023_stock_valuation_snapshots.sql:/docker-entrypoint-initdb.d/023_stock_valuation_snapshots.sql:ro
      - ../db/024_stock_movement_exports.sql:/docker-entrypoint-initdb.d/024_stock_movement_exports.sql:ro
      - ../db/025_register_diagnostics.sql:/docker-entrypoint-initdb.d/025_register_diagnostics.sql:ro
      - ../db/026_shift_recovery.sql:/docker-entrypoint-initdb.d/026_shift_recovery.sql:ro
      - ../db/026_quantity_promotions.sql:/docker-entrypoint-initdb.d/026_quantity_promotions.sql:ro
      - ../db/027_lot_retail_settings.sql:/docker-entrypoint-initdb.d/027_lot_retail_settings.sql:ro
      - ../db/028_weighed_price_labels.sql:/docker-entrypoint-initdb.d/028_weighed_price_labels.sql:ro
      - ../db/029_staff_roles.sql:/docker-entrypoint-initdb.d/029_staff_roles.sql:ro
      - ../db/030_platform_staff.sql:/docker-entrypoint-initdb.d/030_platform_staff.sql:ro
      - ../db/031_test_store_markers.sql:/docker-entrypoint-initdb.d/031_test_store_markers.sql:ro
      - ../db/032_platform_store_events.sql:/docker-entrypoint-initdb.d/032_platform_store_events.sql:ro
      - ../db/033_test_store_isolation.sql:/docker-entrypoint-initdb.d/033_test_store_isolation.sql:ro
      - ../db/034_platform_login_audit.sql:/docker-entrypoint-initdb.d/034_platform_login_audit.sql:ro
      - ../db/035_platform_runtime_grants.sql:/docker-entrypoint-initdb.d/035_platform_runtime_grants.sql:ro
      - ../db/036_platform_desktop_contract.sql:/docker-entrypoint-initdb.d/036_platform_desktop_contract.sql:ro
      - ../db/037_platform_owner_accounts.sql:/docker-entrypoint-initdb.d/037_platform_owner_accounts.sql:ro
      - ../db/038_store_operator_auth.sql:/docker-entrypoint-initdb.d/038_store_operator_auth.sql:ro
      - ./init-keycloak-db.sh:/docker-entrypoint-initdb.d/100_init_keycloak.sh:ro
      - ./init-kasa-bootstrap.sh:/docker-entrypoint-initdb.d/900_init_kasa_bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kasa_owner -d kasa"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://kassa.qr-space.uz/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: master-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${KASA_SECRETS_DIR:?set KASA_SECRETS_DIR}/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy

  clamd:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Pos: Host=db;Port=5432;Database=kasa;Username=kasa_api;Password=${POS_DB_APP_PASSWORD:?set POS_DB_APP_PASSWORD}
      Auth__Authority: https://kassa.qr-space.uz/auth/realms/kasa
      Auth__Audience: kasa-api
      Auth__AdminAcr: "1"
      Auth__AllowTemporaryPlatformDeveloperMfaOnly: ${KASA_TEMP_PLATFORM_MFA_ONLY:-false}
      Auth__TemporaryPlatformDeveloperIssuer: ${KASA_TEMP_PLATFORM_ISSUER:-}
      Auth__TemporaryPlatformDeveloperSubject: ${KASA_TEMP_PLATFORM_SUBJECT:-}
      Auth__TemporaryPlatformDeveloperExpiresAt: ${KASA_TEMP_PLATFORM_EXPIRES_AT:-}
      IdentityProvisioning__Enabled: ${KASA_IDENTITY_PROVISIONING_ENABLED:-false}
      IdentityProvisioning__BaseUrl: ${KASA_IDENTITY_PROVISIONING_BASE_URL:-http://keycloak:8080/auth/}
      IdentityProvisioning__Realm: ${KASA_IDENTITY_PROVISIONING_REALM:-kasa}
      IdentityProvisioning__TokenRealm: ${KASA_IDENTITY_PROVISIONING_TOKEN_REALM:-kasa}
      IdentityProvisioning__ClientId: ${KASA_IDENTITY_PROVISIONING_CLIENT_ID:-kasa-platform-provisioner}
      IdentityProvisioning__ClientSecret: ${KASA_IDENTITY_PROVISIONING_CLIENT_SECRET:-}
      Purchasing__RequireReceiptAttachment: "true"
      InvoiceScanner__Host: clamd
      InvoiceScanner__Port: "3310"
      RateLimiting__PermitLimit: "180"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      clamd:
        condition: service_started

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - keycloak

volumes:
  kasa_postgres_data:
  clamav_data:
