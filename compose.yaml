services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kasa
      POSTGRES_USER: kasa_owner
      POSTGRES_PASSWORD: ${POS_DB_OWNER_PASSWORD:?set POS_DB_OWNER_PASSWORD}
      POS_DB_APP_PASSWORD: ${POS_DB_APP_PASSWORD:?set POS_DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:${POS_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/002_runtime_role.sh:/docker-entrypoint-initdb.d/002_runtime_role.sh:ro
      - ./db/003_returns_and_receipts.sql:/docker-entrypoint-initdb.d/003_returns_and_receipts.sql:ro
      - ./db/004_suppliers_invoice_files_receipt_costs.sql:/docker-entrypoint-initdb.d/004_suppliers_invoice_files_receipt_costs.sql:ro
      - ./db/005_inventory_and_expiry.sql:/docker-entrypoint-initdb.d/005_inventory_and_expiry.sql:ro
      - ./db/006_catalog_and_prices.sql:/docker-entrypoint-initdb.d/006_catalog_and_prices.sql:ro
      - ./db/007_checkout_and_cash.sql:/docker-entrypoint-initdb.d/007_checkout_and_cash.sql:ro
      - ./db/008_supplier_procurement.sql:/docker-entrypoint-initdb.d/008_supplier_procurement.sql:ro
      - ./db/009_replenishment.sql:/docker-entrypoint-initdb.d/009_replenishment.sql:ro
      - ./db/010_replenishment_policies.sql:/docker-entrypoint-initdb.d/010_replenishment_policies.sql:ro
      - ./db/011_replenishment_refresh.sql:/docker-entrypoint-initdb.d/011_replenishment_refresh.sql:ro
      - ./db/012_sales_period_reports.sql:/docker-entrypoint-initdb.d/012_sales_period_reports.sql:ro
      - ./db/013_stock_movement_reports.sql:/docker-entrypoint-initdb.d/013_stock_movement_reports.sql:ro
      - ./db/014_supplier_invoice_settlements.sql:/docker-entrypoint-initdb.d/014_supplier_invoice_settlements.sql:ro
      - ./db/015_supplier_credit_transfers.sql:/docker-entrypoint-initdb.d/015_supplier_credit_transfers.sql:ro
      - ./db/016_opening_stock.sql:/docker-entrypoint-initdb.d/016_opening_stock.sql:ro
      - ./db/017_scoped_inventory.sql:/docker-entrypoint-initdb.d/017_scoped_inventory.sql:ro
      - ./db/018_inventory_cost.sql:/docker-entrypoint-initdb.d/018_inventory_cost.sql:ro
      - ./db/019_register_devices.sql:/docker-entrypoint-initdb.d/019_register_devices.sql:ro
      - ./db/020_staff_store_access.sql:/docker-entrypoint-initdb.d/020_staff_store_access.sql:ro
      - ./db/021_audit_read.sql:/docker-entrypoint-initdb.d/021_audit_read.sql:ro
      - ./db/022_receipt_cancellation.sql:/docker-entrypoint-initdb.d/022_receipt_cancellation.sql:ro
      - ./db/023_stock_valuation_snapshots.sql:/docker-entrypoint-initdb.d/023_stock_valuation_snapshots.sql:ro
      - ./db/024_stock_movement_exports.sql:/docker-entrypoint-initdb.d/024_stock_movement_exports.sql:ro
      - ./db/025_register_diagnostics.sql:/docker-entrypoint-initdb.d/025_register_diagnostics.sql:ro
      - ./db/026_quantity_promotions.sql:/docker-entrypoint-initdb.d/026_quantity_promotions.sql:ro
      - ./db/027_lot_retail_settings.sql:/docker-entrypoint-initdb.d/027_lot_retail_settings.sql:ro
      - ./db/028_weighed_price_labels.sql:/docker-entrypoint-initdb.d/028_weighed_price_labels.sql:ro
      - ./db/029_staff_roles.sql:/docker-entrypoint-initdb.d/029_staff_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kasa_owner -d kasa"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
